[project]
name = "kb-retrieval-sys"
version = "0.1.0"
description = "企业知识库检索系统 - L1 摄入/检索底座 + L2 Python Agent (P0 M1–M5)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "tabulate>=0.9",
    "click>=8.1",
    "openai>=1.0",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",   # 生成合成 PDF fixture
    "httpx>=0.27",
]

[project.scripts]
kb = "kb_retrieval.kb.cli.kb:cli"
kb-serve = "kb_retrieval.kb.service.app:run"
kb-agent-serve = "kb_retrieval.agent.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests", "kb_retrieval/agent/tests"]
pythonpath = ["."]
markers = [
    "e2e: end-to-end against real L1+LLM (skipped by default)",
]
addopts = "-m 'not e2e'"
