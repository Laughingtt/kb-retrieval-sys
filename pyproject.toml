[project]
name = "l1-kb"
version = "0.1.0"
description = "L1 知识库层 - 清洗/索引/检索 pipeline (P0 M1)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "tabulate>=0.9",
    "click>=8.1",
    "openai>=1.0",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",   # 生成合成 PDF fixture
    "httpx>=0.27",
]

[project.scripts]
kb = "l1_kb.cli.kb:cli"
kb-serve = "l1_kb.service.app:run"
kb-agent-serve = "l2_agent.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l1_kb"]

[tool.pytest.ini_options]
testpaths = ["tests", "l2_agent/tests"]
pythonpath = ["."]
markers = [
    "e2e: end-to-end against real L1+LLM (skipped by default)",
]
addopts = "-m 'not e2e'"
